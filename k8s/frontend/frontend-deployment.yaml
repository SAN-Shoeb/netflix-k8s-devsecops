apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: media-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: yourdockerhubuser/netflix-frontend:latest
          imagePullPolicy: Always
          resources:
            requests:
              memory: "30Mi"
              cpu: "50m"
            limits:
              memory: "60Mi"
              cpu: "100m"
          ports:
            - containerPort: 80